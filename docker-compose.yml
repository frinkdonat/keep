services:
  keep:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keep-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${API_KEY:-keep_secret_token_12345}
      - MASTER_PASSCODE=${MASTER_PASSCODE:-}
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
