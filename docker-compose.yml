services:
  keep:
    image: frinkdonat/keep:latest
    container_name: keep-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-changeme}
      - API_KEY=${API_KEY:-keep_secret_api_key}
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
