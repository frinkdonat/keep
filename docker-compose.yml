services:
  keep:
    image: frinkdonat/keep:latest
    container_name: keep-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${API_KEY:-keep_sec_43d2140f76b3aee82c32c4f11e49b950ebe0d355d82e937b}
      - MASTER_PASSCODE=${MASTER_PASSCODE:-}
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
