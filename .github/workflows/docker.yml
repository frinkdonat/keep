name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout, Build, and Push to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker build --platform linux/amd64 \
            -t "frinkdonat/keep:latest" \
            -t "frinkdonat/keep:${GITHUB_SHA}" \
            .
          docker push "frinkdonat/keep:latest"
          docker push "frinkdonat/keep:${GITHUB_SHA}"
