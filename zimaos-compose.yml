name: keep
services:
  keep:
    image: frinkdonat/keep:latest
    container_name: keep-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - USERNAME=admin
      - PASSWORD=changeme
      - API_KEY=keep_secret_api_key
      - DATA_DIR=/app/data
    volumes:
      - /DATA/AppData/keep/data:/app/data
    x-casaos:
      envs:
        - container: USERNAME
          description:
            en_us: Web UI login username
        - container: PASSWORD
          description:
            en_us: Web UI login password
        - container: API_KEY
          description:
            en_us: Secret token for Chrome Extension
      ports:
        - container: "3000"
          description:
            en_us: Web UI port
      volumes:
        - container: /app/data
          description:
            en_us: SQLite data directory
x-casaos:
  architectures:
    - amd64
  main: keep
  author: frinkdonat
  category: Utilities
  description:
    en_us: Minimalist, stripped-down watch later & curated bookmarking app with 1-click Chrome Extension.
  developer: USU
  icon: https://raw.githubusercontent.com/frinkdonat/keep/main/public/icon.png
  title:
    en_us: Keep
  index: /
  port_map: "3000"
